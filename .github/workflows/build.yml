name: Build RMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK: 67108864
    steps:
      - uses: actions/checkout@v4

      - name: Verify native dependencies
        shell: bash
        run: |
          set -euo pipefail

          find_libclang() {
            local latest_llvm_lib
            latest_llvm_lib="$(
              find /usr/lib/llvm-*/lib \
                -maxdepth 1 \
                \( -name 'libclang.so*' -o -name 'libclang-[0-9]*.so*' \) \
                -print 2>/dev/null | sort -V -r | head -n 1 || true
            )"
            if [[ -n "$latest_llvm_lib" ]]; then
              printf '%s\n' "$latest_llvm_lib"
              return
            fi

            find /usr/lib/x86_64-linux-gnu \
              -maxdepth 1 \
              \( -name 'libclang.so*' -o -name 'libclang-[0-9]*.so*' \) \
              -print -quit 2>/dev/null || true
          }

          clang_path="$(command -v clang || true)"
          libclang_file="$(find_libclang)"

          if [[ -z "$clang_path" || -z "$libclang_file" ]]; then
            packages=()
            [[ -n "$clang_path" ]] || packages+=(clang)
            [[ -n "$libclang_file" ]] || packages+=(libclang-dev)

            echo "Installing missing native dependencies: ${packages[*]}"
            apt_options=(
              -o Acquire::Retries=3
              -o Acquire::http::Timeout=30
              -o Acquire::https::Timeout=30
            )
            timeout 180s sudo apt-get "${apt_options[@]}" update
            timeout 180s sudo apt-get "${apt_options[@]}" install \
              --no-install-recommends -y "${packages[@]}"

            clang_path="$(command -v clang || true)"
            libclang_file="$(find_libclang)"
          fi

          test -n "$clang_path"
          test -n "$libclang_file"
          "$clang_path" --version
          echo "LIBCLANG_PATH=$(dirname "$libclang_file")" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: cargo-bins/cargo-binstall@main

      - name: Install firmware tools
        run: cargo binstall cargo-make cargo-binutils cargo-hex-to-uf2 flip-link -y

      - name: Build firmware and generate UF2/HEX
        run: cargo make uf2 --release

      - name: Stage ELF firmware
        env:
          PROJECT_NAME: Cygnus-M-RMK
        run: |
          for bin in central peripheral; do
            cp "target/thumbv7em-none-eabihf/release/$bin" "${PROJECT_NAME}-${bin}.elf"
          done

      - name: Validate firmware files
        run: file Cygnus-M-RMK-*.uf2 Cygnus-M-RMK-*.hex Cygnus-M-RMK-*.elf

      - name: Upload UF2 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Cygnus-M-RMK-firmware_uf2
          path: Cygnus-M-RMK-*.uf2
          if-no-files-found: error

      - name: Upload HEX artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Cygnus-M-RMK-firmware_hex
          path: Cygnus-M-RMK-*.hex
          if-no-files-found: error

      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Cygnus-M-RMK-firmware_elf
          path: Cygnus-M-RMK-*.elf
          if-no-files-found: error
